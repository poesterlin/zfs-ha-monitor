[package]
name = "zfs-ha-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
rumqttc = { version = "0.24", features = ["url", "use-rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
dotenvy = "0.15"
url = "2.5"

[profile.release]
lto = true
strip = true
codegen-units = 1
